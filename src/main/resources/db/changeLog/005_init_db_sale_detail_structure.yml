databaseChangeLog:
  - changeSet:
      id: 005_init_db_sale_detail_structure
      author: kistolanysokot@gmail.com
      changes:
        - createTable:
            tableName: sale_detail
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: sale_id
                  type: BIGINT
                  constraints:
                    foreignKey:
                      constraintName: fk_sale_sale_detail
                      references: sale(sale_id)
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    foreignKey:
                      constraintName: fk_product_sale_detail
                      references: products(product_id)
              - column:
                  name: amounth
                  type: DECIMAL
              - column:
                  name: unit
                  type: BIGINT